<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ZenCode – AI Collaborative Studio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Meta tags for AI & Collaboration Features -->
    <meta name="description" content="Build, deploy, and collaborate with AI in a focused environment.">
    <meta name="keywords" content="AI, software, collaborate, IDE, deploy, code">
    
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --accent-glow: #58a6ff;
            --text-main: #c9d1d9;
            --border-soft: #30363d;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* Distinct non-Replit Sidebar */
        .minimal-nav {
            width: 60px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        /* Centered Workspace Concept */
        .workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .editor-container {
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            flex-grow: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
        }

        /* AI Chat Overlay (Right Side) */
        .ai-assistant {
            width: 300px;
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--border-soft);
            padding: 15px;
        }

        .status-bar {
            height: 30px;
            font-size: 12px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: var(--bg-dark);
        }
    </style>
</head>
<body>

    <nav class="minimal-nav">
        <!-- Icons for AI Agent, Files, and Deployment -->
        <div style="margin-bottom: 20px;">🤖</div>
        <div style="margin-bottom: 20px;">📁</div>
        <div style="margin-bottom: 20px;">🚀</div>
    </nav>

    <main class="workspace">
        <header style="margin-bottom: 15px; display: flex; justify-content: space-between;">
            <h2 style="margin: 0; font-weight: 400;">Project: <span style="color: var(--accent-glow);">Quantum_App</span></h2>
            <button style="background: var(--accent-glow); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Run Now</button>
        </header>

        <div class="editor-container">
            <div style="flex-grow: 1; padding: 20px; font-family: 'Courier New', monospace;">
                // Write your code here...
            </div>
            
            <aside class="ai-assistant">
                <h4 style="margin-top: 0;">AI Agent</h4>
                <p style="font-size: 13px; opacity: 0.7;">How can I help you build today?</p>
                <input type="text" placeholder="Ask AI to generate code..." style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid var(--border-soft); color: white; border-radius: 4px;">
            </aside>
        </div>
    </main>

    <footer class="status-bar">
        <span>Connected to Cloud Environment</span>
        <span style="margin-left: auto;">UTF-8 | JavaScript</span>
    </footer>

</body>
</html>
